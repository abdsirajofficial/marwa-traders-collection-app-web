[package]
name = "marwa-traders-cms"
version = "1.0.0"
description = "Marwa Traders CMS Windows Desktop App"
authors = ["Marwa Traders"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
